<div class="draw-layout">
    <div class="palette">
        <h3>Palette</h3>
        <button
            draggable="true"
            (dragstart)="startPaletteDrag($event, 'place')"
            (dragend)="endPaletteDrag()">
            + Place
        </button>
        <button
            draggable="true"
            (dragstart)="startPaletteDrag($event, 'transition')"
            (dragend)="endPaletteDrag()">
            + Transition
        </button>
        <p class="hint">Right-click to connect, middle-click to delete</p>
    </div>

    <div class="canvas-container">
        <div class="inline-tuple-input">
            <textarea
                [(ngModel)]="tupleString"
                [placeholder]="'TUPLE_INPUT.LABEL' | translate"
                rows="3"
                (keyup.enter)="generateNetFromInput()"></textarea>
            <button (click)="generateNetFromInput()" [disabled]="!tupleString.trim().length">
                {{ 'TUPLE_INPUT.GENERATE' | translate }}
            </button>
        </div>

        <svg
            #drawingArea
            class="drawing-canvas"
            [class.drag-over]="isDragOver()"
            [attr.viewBox]="viewBox()"
            preserveAspectRatio="xMidYMid meet"
            (drop)="onDrop($event)"
            (dragover)="onDragOver($event)"
            (dragleave)="onDragLeave()"
            (contextmenu)="preventContext($event)"
            (mousedown)="onCanvasPanStart($event)"
            (mousemove)="onCanvasPan($event)"
            (mouseup)="onCanvasPanEnd()"
            (mouseleave)="onCanvasPanEnd()"
            (wheel)="onCanvasWheel($event)">
            <defs>
                <marker id="arrowhead-draw" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="black" />
                </marker>
            </defs>
            <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
                <path d="M 50 0 L 0 0 0 50" fill="none" stroke="lightgray" stroke-width="0.5" />
            </pattern>
            <rect
                [attr.x]="viewBoxObj().minX"
                [attr.y]="viewBoxObj().minY"
                [attr.width]="viewBoxObj().width"
                [attr.height]="viewBoxObj().height"
                fill="url(#grid)" />

            @for (line of connectionLines(); track line.id) {
            <g class="connection-group" [attr.data-connection-id]="line.id">
                <line
                    class="connection-hit-target"
                    [attr.x1]="line.x1"
                    [attr.y1]="line.y1"
                    [attr.x2]="line.x2"
                    [attr.y2]="line.y2"
                    (mousedown)="onConnectionMouseDown($event, line.id)"
                    (wheel)="onConnectionWheel($event, line.id)" />
                <line
                    class="connection-line"
                    [attr.x1]="line.x1"
                    [attr.y1]="line.y1"
                    [attr.x2]="line.x2"
                    [attr.y2]="line.y2"
                    marker-end="url(#arrowhead-draw)" />
                @if (line.weight > 1) {
                <text
                    [attr.x]="(line.x1 + line.x2) / 2"
                    [attr.y]="(line.y1 + line.y2) / 2 - 10"
                    text-anchor="middle"
                    dominant-baseline="central"
                    class="connection-weight-label">
                    {{ line.weight }}
                </text>
                }
            </g>
            }

            @for (element of drawnElements(); track $index) {
            <g class="element-wrapper" [attr.data-element-id]="element.node.displayLabel">
                <g
                    appSvgNode
                    [diagramNode]="element.node"
                    [selected]="selectedElementId() === element.id"
                    [showInnerLabel]="false"
                    [transitionLabelPlacement]="'inside'" />
                <rect
                    class="drag-overlay"
                    [attr.x]="element.node.x - 60"
                    [attr.y]="element.node.y - 60"
                    width="120"
                    height="120"
                    fill="none"
                    stroke="none"
                    pointer-events="all"
                    style="cursor: move"
                    (mousedown)="onElementMouseDown($event, element)"
                    (contextmenu)="onElementRightClick($event, element)"
                    (dblclick)="onElementDoubleClick($event, element)"
                    (wheel)="onElementWheel($event, element)" />
            </g>
            }
        </svg>
    </div>
</div>
